# An example of cluster config that uses access entries for cluster access management

apiVersion: eksctl.io/v1alpha5 
kind: ClusterConfig 

metadata:
  name: roboshop # this is EKS cluster name 
  region: us-east-1 

accessConfig:
  # it means we are using both aws-auth and configmap, we are in the process of migrating to access entries.
  # new users follow API way, old users are following CONFIG_MAP way. priority is API 
  # slowly we move old users to API way 
  authenticationMode: API_AND_CONFIG_MAP 
  accessEntries:
  - principalARN: arn:aws:iam::875926135141:user/Purna
    type: STANDARD # optional Type 
    kubernetesGroups: # optional kubernetes groups 
      - devops-trainees # groups can be used to give permissions via RBAC 
  - principalARN: arn:aws:iam::875926135141:user/Chand
    type: STANDARD # optional Type 
    kubernetesGroups: # optional kubernetes groups 
      - devops-trainees # groups can be used to give permissions via RBAC 
  - principalARN: arn:aws:iam::875926135141:user/zhiachc
    type: STANDARD 
    kubernetesGroups: 
      - devops-tls 

